[project]
name = "vaultic-password-manager"
version = "0.1.0"
description ="An offline, local-first password manager built in Python"
requires-python = ">=3.11"
dependencies = [
    "cryptography==49.0.0",
    "click==8.4.2"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "black==26.5.1",
    "ruff==0.15.22",
    "mypy==2.3.0",
    "detect-secrets==1.5.0",
    "pre_commit==4.6.1"
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]